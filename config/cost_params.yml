# Dimension & Weight Integrity — Business Parameters
#
# Every value in this file is a calibratable business parameter.
# Physics (cube, density, freight class) are computed in dbt macros, never here.
#
# Consumers of these values:
#   - The frontend JSON export (scripts/export_frontend_json.py) reads its rate
#     tables directly from this file.
#   - The dbt models read a mirrored copy from dbt/dbt_project.yml (vars:).
#     This file is the documented source of record; dbt_project.yml mirrors it,
#     and the two MUST be kept in sync.
#
# PARAM tags mark each value as a tunable business parameter.
# Source citations document the basis for each value.

# --- LTL Freight Rates ---
# Source: modeled stand-in based on industry benchmarks
#   15-25% cost increase per class step (Red Stag, Jansson LLC)
#   Rates are $/cwt (per hundred weight) by NMFC class
ltl:
  rate_per_cwt:  # PARAM — $/cwt by NMFC freight class
    50: 18.00
    55: 19.80
    60: 21.78
    65: 23.96
    70: 26.35
    77.5: 28.99
    85: 31.89
    92.5: 35.08
    100: 38.59
    110: 42.44
    125: 46.69
    150: 51.36
    175: 56.49
    200: 62.14
    250: 68.36
    300: 75.19
    400: 82.71
    500: 90.98
  reclassification_inspection_fee: 112.50  # REFERENCE ONLY (not read by any model) — $/shipment, source: industry $75-$150 range midpoint. The cost engine bills the class-rate delta, not an inspection fee.

  # --- LTL annual volume: annual CASES, not pallets ---
  #
  # LTL bills per hundredweight, so a reclassification penalty falls on the
  # tonnage shipped, not on how that tonnage is stacked. cases_per_pallet
  # cancels out of the cost entirely:
  #
  #   (cases_per_pallet x case_lb / 100) x rate_delta x pallets_per_year
  #     == (case_lb / 100) x rate_delta x (cases_per_pallet x pallets_per_year)
  #     == (case_lb / 100) x rate_delta x ANNUAL CASES
  #
  # The engine therefore prices a $/case delta against an annual case count.
  # It does NOT need ti/hi or cases_per_pallet, and no such field exists.
  #
  # This replaces a free-floating `annual_pallet_shipments_per_sku` (shipped
  # at 52; the build spec illustrated 520). Both were asserted pallet counts
  # with no source, and the 10x spread between them moved the headline 10x.
  # Annual cases are instead DERIVED from figures the Cinderhaven dataset
  # already publishes, leaving exactly one new calibratable price:
  #
  #   annual_cases_per_sku
  #     = annual_wholesale_revenue_per_sku / wholesale_price_per_unit
  #       / case_pack_qty          <- per-SKU, already in the measurement of record
  #
  # DTC is not netted out: at 200 orders/SKU/yr it is ~0.2% of unit volume,
  # well inside the rounding on the revenue figure itself.
  annual_wholesale_revenue_per_sku: 500000.00  # DERIVED — $25M annual revenue / 50 SKUs (CINDERHAVEN_CANONICAL.md: "Annual revenue ~$25M", "SKU count 50"). Assumes revenue is spread evenly across the catalog.
  wholesale_price_per_unit: 3.84  # PARAM — $/unit. Catalog mean MSRP $7.67 x blended non-DTC wholesale multiplier 0.5000 (mean of the 9 retail+distributor rates in the Cinderhaven seed catalog: Walmart .50, Costco .48, Whole Foods .58, Sprouts .55, Kroger .52, Regional .52, UNFI .45, KeHE .46, DPI .44). DTC excluded — it sells at MSRP and does not ship LTL.

# --- Parcel Rates ---
# Source: FedEx Ground Zone 5, 2026 list rates (Quadient/FedEx Rate Guide)
#   List: 1lb=$14.00, 2lb=$15.66, 3lb=$16.81, 4lb=$17.73, 5lb=$18.53
#   Modeled at ~30% discount (typical small-brand negotiated rate)
parcel:
  rate_per_lb:  # PARAM — $/shipment by weight tier (lb), discounted from list
    1: 9.80
    2: 10.96
    3: 11.77
    4: 12.41
    5: 12.97
  list_rate_per_lb:  # Reference only — published FedEx Ground Zone 5 2026 list rates
    1: 14.00
    2: 15.66
    3: 16.81
    4: 17.73
    5: 18.53
  dim_divisor: 139  # PARAM — FedEx/UPS domestic standard (USPS moves to 139 July 2026)
  # PARAM — assumes ONE unit per DTC order. This is the highest-leverage
  # assumption in the parcel lane: multi-unit orders raise both the parcel
  # weight and the box size, which pushes the shipment below the DIM
  # threshold and roughly doubles parcel cost. Calibrate against real order
  # composition before quoting the parcel figure to a client.
  annual_dtc_orders_per_sku: 200
  # PARAM — per-unit DTC shipping box (inches, cube). A DTC order ships one
  # unit, not a case, so parcel DIM weight uses this box — never the retail
  # case dimensions.
  #
  # SENSITIVITY (this parameter is a cliff, not a dial). DIM weight bills only
  # when a parcel is light for its size; the crossover is 1728/dim_divisor =
  # 12.43 lb/ft^3. These jars run 11.6-24.4 lb/ft^3 in a 6in box, i.e. mostly
  # dense enough that actual weight wins and DIM never binds. Portfolio parcel
  # cost by box size: 5in and 6in both $9,988; 7in $13,228; 8in $19,372.
  # The shipped figure therefore sits at the DIM-never-binds floor. Raising
  # this value without evidence would manufacture cost, so it stays at 6.0
  # until Cinderhaven's real shipper dimensions are known.
  dtc_parcel_box_in: 6.0

# --- Compliance Chargebacks ---
# Source: Walmart SQEP ($200 base + $4/non-compliant pallet), Costco (2% of invoice)
#   Dimension-specific chargebacks modeled as subset of pallet/packaging violations
#   Labeled as modeled assumption — not published as standalone category
chargebacks:
  per_event_cost: 200.00  # PARAM — $/event, modeled from Walmart SQEP base
  per_pallet_surcharge: 4.00  # REFERENCE ONLY (not read by any model) — $/non-compliant pallet (Walmart SQEP). Documents the published SQEP structure behind per_event_cost.
  annual_events_per_sku: 3  # PARAM — estimated annual chargeback events per affected SKU
  affected_sku_pct: 0.40  # PARAM — fraction of divergent SKUs that actually incur chargebacks. Mirrored in dbt_project.yml as chargeback_affected_sku_pct and applied in fct_dimension_cost.sql to scale expected chargeback events (3 -> 1.2).

# --- Divergence Tolerances ---
# Thresholds for flagging system divergence
tolerances:
  weight_lb: 0.50  # PARAM — absolute lb difference to flag as divergent
  dimension_in: 0.50  # PARAM — absolute inch difference to flag as divergent
  # Divergence flagging is ABSOLUTE-tolerance only (see fct_attribute_divergence.sql).
  # These percentage thresholds are documented alternatives, deliberately not wired
  # up — flagging on both absolute and percentage would double-count the same row.
  weight_pct: 0.03  # REFERENCE ONLY (not read by any model) — percentage weight difference
  dimension_pct: 0.05  # REFERENCE ONLY (not read by any model) — percentage dimension difference

# --- Hero SKU Reference Values ---
# These are NOT parameters — they are the measurement-of-record values
# used for reconciliation testing. Computed from physical measurement.
hero_sku:
  sku_id: null  # Resolved during data generation from product_master
  case_gross_weight_lb: 21.50
  case_length_in: 11.25
  case_width_in: 8.50
  case_height_in: 5.25
  unit_net_weight_lb: 1.00
  dtc_parcel_gross_lb: 2.05
  case_pack_qty: 12
